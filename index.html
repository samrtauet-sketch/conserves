<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Mes Conserves</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%AB%99%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --fond: #fbf6ee;
    --carte: #ffffff;
    --trait: #e7dccb;
    --encre: #2f2a24;
    --encre-pale: #7a6f61;
    --accent: #b4552a;
    --accent-fond: #fdeee5;
    --ombre: 0 1px 2px rgba(47, 42, 36, .06), 0 8px 24px rgba(47, 42, 36, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fond: #1b1814;
      --carte: #262118;
      --trait: #3b3328;
      --encre: #f2ead9;
      --encre-pale: #a99b86;
      --accent: #e08b5c;
      --accent-fond: #33251b;
      --ombre: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --fond: #1b1814;
    --carte: #262118;
    --trait: #3b3328;
    --encre: #f2ead9;
    --encre-pale: #a99b86;
    --accent: #e08b5c;
    --accent-fond: #33251b;
    --ombre: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--fond);
    color: var(--encre);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: max(16px, env(safe-area-inset-left, 0px));
    padding-block: 32px;
  }
  main {
    width: 100%;
    max-width: 24rem;
    background: var(--carte);
    border: 1px solid var(--trait);
    border-radius: 18px;
    box-shadow: var(--ombre);
    padding: 28px 24px 24px;
    text-align: center;
  }
  .bocal { font-size: 54px; line-height: 1; }
  h1 {
    font-size: 1.45rem;
    margin: 12px 0 2px;
    text-wrap: balance;
    letter-spacing: -.01em;
  }
  .sous {
    margin: 0 0 20px;
    color: var(--encre-pale);
    font-size: .9rem;
  }
  .etat {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: stretch;
  }
  p { margin: 0; }
  .gros { font-weight: 600; }
  .menu {
    font-size: .92rem;
    color: var(--encre-pale);
    text-wrap: pretty;
  }
  a.bouton, button.bouton {
    display: block;
    width: 100%;
    padding: 14px 18px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  a.bouton:active, button.bouton:active { transform: translateY(1px); }
  .encadre {
    background: var(--accent-fond);
    border: 1px solid var(--trait);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: left;
    font-size: .92rem;
  }
  .encadre code {
    display: block;
    margin-top: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .85rem;
    word-break: break-all;
    color: var(--accent);
  }
  .pied {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--trait);
    font-size: .8rem;
    color: var(--encre-pale);
    text-wrap: pretty;
  }
  .attente { color: var(--encre-pale); }
  @media (prefers-reduced-motion: no-preference) {
    .attente { animation: respire 1.6s ease-in-out infinite; }
    @keyframes respire { 50% { opacity: .45; } }
  }
</style>
</head>
<body>
<main>
  <div class="bocal" aria-hidden="true">&#129497;</div>
  <h1>Mes Conserves</h1>
  <p class="sous">La r&eacute;serve de la maison</p>

  <div class="etat" id="etat" role="status" aria-live="polite">
    <p class="attente">Je cherche la r&eacute;serve&hellip;</p>
  </div>

  <p class="pied">
    Cette page ne garde aucune donn&eacute;e&nbsp;: elle ne sait que l&rsquo;adresse du
    moment. Les bocaux, eux, restent sur l&rsquo;ordinateur de la maison, et le
    code d&rsquo;acc&egrave;s est demand&eacute; &agrave; l&rsquo;arriv&eacute;e.
  </p>
</main>

<script>
(function () {
  'use strict';

  var etat = document.getElementById('etat');

  function vide() { while (etat.firstChild) etat.removeChild(etat.firstChild); }

  function ligne(texte, classe) {
    var p = document.createElement('p');
    if (classe) p.className = classe;
    p.textContent = texte;
    return p;
  }

  function ouverte(url) {
    vide();
    etat.appendChild(ligne('La réserve est ouverte.', 'gros'));

    var a = document.createElement('a');
    a.className = 'bouton';
    a.href = url;
    a.rel = 'noreferrer';
    a.textContent = 'Entrer dans la réserve';
    etat.appendChild(a);

    etat.appendChild(ligne('Je vous y emmène…', 'menu'));

    // Un instant avant de partir, pour que la page ait le temps de s'afficher
    // et qu'on puisse revenir en arriere sans boucler.
    setTimeout(function () { location.replace(url); }, 1200);
  }

  function fermee() {
    vide();
    etat.appendChild(ligne('La réserve est fermée pour le moment.', 'gros'));

    var d = document.createElement('div');
    d.className = 'encadre';
    d.appendChild(ligne(
      'L’ordinateur de la maison est éteint, ou la porte n’a pas '
      + 'été ouverte. Sur cet ordinateur, lancez :'));
    var c = document.createElement('code');
    c.textContent = '.\\tools\\porte.ps1';
    d.appendChild(c);
    etat.appendChild(d);

    var b = document.createElement('button');
    b.className = 'bouton';
    b.type = 'button';
    b.textContent = 'Réessayer';
    b.addEventListener('click', function () {
      vide();
      etat.appendChild(ligne('Je cherche la réserve…', 'attente'));
      setTimeout(chercher, 300);
    });
    etat.appendChild(b);

    return b;
  }

  function panne(pourquoi) {
    var b = fermee();
    etat.insertBefore(ligne(pourquoi, 'menu'), b);
  }

  function chercher() {
    // L'adresse change a chaque ouverture de tunnel : on evite tout cache.
    fetch('lien.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('lien.json : ' + r.status);
        return r.json();
      })
      .then(function (d) {
        var url = d && typeof d.url === 'string' ? d.url.trim() : '';
        // On n'envoie nulle part ailleurs que sur un tunnel en https.
        if (/^https:\/\/[a-z0-9.-]+\//i.test(url + '/')) ouverte(url);
        else fermee();
      })
      .catch(function (e) {
        panne('Détail : ' + e.message);
      });
  }

  chercher();
})();
</script>
</body>
</html>
